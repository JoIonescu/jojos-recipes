name: Supabase keep-alive
on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "https://dvtjlaamqgyifkrtjmtb.supabase.co/rest/v1/recipes?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
